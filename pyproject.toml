[project]
name = "hf_sae_training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.3.0",
    "av==14.2.0",
    "datasets==2.21.0",
    "diffusers>=0.36.0",
    "einops==0.8.0",
    "flash-attn==2.7.4.post1",
    "ipykernel>=6.30.1",
    "ipython>=8.37.0",
    "jaxtyping>=0.3.3",
    "jupyter>=1.1.1",
    "lang-sam",
    "matplotlib>=3.10.6",
    "opencv-python>=4.12.0.88",
    "pillow==10.4.0",
    "python-dotenv>=1.1.1",
    "qwen-vl-utils>=0.0.14",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "torch",
    "torchvision",
    "torchaudio",
    "transformers==4.51.0",
    "umap-learn==0.5.7",
    "wandb==0.19.4",
    "zstandard==0.22.0",
]

[tool.uv]
no-build-isolation-package = ['flash-attn']

[tool.uv.workspace]
members = [
    "lang-segment-anything",
]

[tool.uv.sources]
lang-sam = { workspace = true }

torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true